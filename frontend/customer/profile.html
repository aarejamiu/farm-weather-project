<body>
<nav class="cust-nav">

    <div class="cust-nav-links">

<main class="profile-page">
    <section class="profile-hero">
        <div class="profile-avatar-large" id="profileAvatar">SM</div>
        <div class="profile-identity"><h1 id="profileName">Loading...</h1><p id="profileEmail"></p><div class="profile-pills"><span id="ordersPill">0 Orders</span><span id="spentPill">₦0 Spent</span><span>☆ Gold Member</span></div></div>
    </section>
    <section class="profile-panel" id="profilePanel">
        <form id="profileForm"><div class="profile-form-grid"><label>First Name<input id="firstName" required></label><label>Last Name<input id="lastName"></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" type="tel"></label></div><div class="profile-form-actions"><button type="submit">▣ Save Changes</button><span id="profileMessage" role="status"></span></div></form>
    </section>
</main>
<script src="./profile.js"></script>
</body>
