<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station — Leaders-Union Smart Farm</title>
<link rel="stylesheet" href="farmer.css">
<link rel="stylesheet" href="weather.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-layout">

    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <span class="view-as-label">VIEW AS</span>
                <button class="view-btn view-btn--active">Farmer Admin</button>
                <a href="../customer/home.html" class="view-btn">Customer</a>
            </div>
            <div class="topbar-right">
                <span class="live-dot"></span>
                <span class="live-label">Leaders-Union Farm &middot; Live</span>
                <div class="top-avatar" id="topAvatar">EO</div>
            </div>
        </header>

        <main class="main-content">

            <div class="page-heading">
                <div>
                    <h1 class="page-title">Weather Station</h1>
                    <p class="page-sub">Live conditions &middot; <span id="lastUpdated">Updating...</span></p>
                </div>
            </div>

            <div class="weather-hero card--dark">
                <div class="wh-left">
                    <div class="wh-live-label">LIVE &middot; <span id="heroLocation">LEADERS-UNION FARM</span></div>
                    <div class="wh-temp"><span id="heroTemp">--</span><span class="wh-temp-unit">&deg;C</span></div>
                    <div class="wh-condition" id="heroCondition">Loading...</div>
                    <div class="wh-feels" id="heroFeels">--</div>
                </div>
                <div class="wh-center" id="weatherIconWrap">
                    <svg class="weather-svg" viewBox="0 0 100 100" fill="none">
                        <circle cx="50" cy="50" r="22" fill="#f59e0b" opacity="0.9"/>
                        <line x1="50" y1="10" x2="50" y2="20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="50" y1="80" x2="50" y2="90" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="10" y1="50" x2="20" y2="50" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="80" y1="50" x2="90" y2="50" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="21" y1="21" x2="28" y2="28" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="72" y1="72" x2="79" y2="79" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="79" y1="21" x2="72" y2="28" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <line x1="28" y1="72" x2="21" y2="79" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="wh-right">
                    <div class="wh-stat-grid">
                        <div class="wh-stat">
                            <div class="wh-stat-label">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                                Humidity
                            </div>
                            <div class="wh-stat-value" id="heroHumidity">--%</div>
                        </div>
                        <div class="wh-stat">
                            <div class="wh-stat-label">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
                                Wind
                            </div>
                            <div class="wh-stat-value" id="heroWind">-- km/h</div>
                        </div>
                        <div class="wh-stat">
                            <div class="wh-stat-label">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                                Visibility
                            </div>
                            <div class="wh-stat-value" id="heroVisibility">-- km</div>
                        </div>
                        <div class="wh-stat">
                            <div class="wh-stat-label">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
                                Pressure
                            </div>
                            <div class="wh-stat-value" id="heroPressure">-- hPa</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div>
                        <h2 class="card-title">Temperature &amp; Humidity &mdash; Today</h2>
                        <div class="chart-legend">
                            <span class="legend-dot legend-dot--red"></span> Temperature &deg;C
                            <span class="legend-dot legend-dot--blue" style="margin-left:16px"></span> Humidity %
                        </div>
                    </div>
                </div>
                <div class="chart-wrap">
                    <canvas id="tempHumidityChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">7-Day Forecast</h2>
                </div>
                <div class="forecast-table" id="forecastTable">
                    <div class="forecast-loading">Loading forecast...</div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="sidebar.js"></script>
<script>SidebarComponent.init('weather');</script>
<script src="weather.js"></script>
</body>
</html>
