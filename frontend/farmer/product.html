<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Leaders-Union Smart Farm</title>
<link rel="stylesheet" href="./farmer.css">
<link rel="stylesheet" href="./products.css">
</head>
<body>
<div class="app-layout">

    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">

        <header class="topbar">
            <div class="topbar-left">
                <span class="view-as-label">VIEW AS</span>
                <button class="view-btn view-btn--active">Farmer Admin</button>
                <a href="../customer/home.html" class="view-btn">Customer</a>
            </div>
            <div class="topbar-right">
                <span class="live-dot"></span>
                <span class="live-label">Leaders-Union Farm &middot; Live</span>
                <div class="top-avatar" id="topAvatar">EO</div>
            </div>
        </header>

        <main class="main-content">

            <div class="page-heading">
                <div>
                    <h1 class="page-title">Products</h1>
                    <p class="page-sub">Manage your farm shop listings</p>
                </div>
            </div>

            <div class="products-toolbar">
                <div class="search-wrap">
                    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search products...">
                </div>
                <a href="inventory.html" class="add-product-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Product
                </a>
            </div>

            <div class="products-grid" id="productsGrid">
                <div class="products-loading">Loading products...</div>
            </div>

        </main>
    </div>
</div>

<!-- IMAGE UPLOAD MODAL -->
<div class="modal-backdrop" id="imageModalBackdrop">
    <div class="modal modal--sm">
        <div class="modal-header">
            <h3 class="modal-title" id="imageModalTitle">Add Image</h3>
            <button class="modal-close" id="closeImageModal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Paste Image URL</label>
                <input type="text" class="form-input" id="imageUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="form-label">Or Upload Image</label>
                <input type="file" class="form-input" id="imageFile" accept="image/*">
            </div>
            <div class="img-preview-wrap" id="imgPreviewWrap" style="display:none">
                <img id="imgPreview" src="" alt="Preview">
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-cancel" id="cancelImageModal">Cancel</button>
            <button class="modal-save" id="saveImageBtn">Save Image</button>
        </div>
    </div>
</div>

<script src="./sidebar.js"></script>
<script src="./products.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        SidebarComponent.init('products');
    });
</script>
</body>
</html>
